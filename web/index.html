<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>nft</title>
    <script>
      // Prefer cached custom logo as favicon before SPA boots (sync with 系统设置).
      (function () {
        try {
          var u = localStorage.getItem('nf-panel-logo-url')
          if (u && u.trim()) {
            var links = document.querySelectorAll("link[rel='icon'], link[rel='apple-touch-icon']")
            for (var i = 0; i < links.length; i++) {
              links[i].setAttribute('href', u.trim())
              links[i].removeAttribute('type')
            }
          }
        } catch (e) {}
      })()
    </script>
    <!-- 妙妙屋 Flat: Inter + Noto Sans SC + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the theme before first paint so the page never flashes light.
      (function () {
        var t = localStorage.getItem('nf-theme')
        var dark = t === 'dark' || (t == null && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
      // Prefer cached panel name immediately; server also rewrites <title> on HTML.
      (function () {
        try {
          var n = localStorage.getItem('nf-panel-name')
          if (n && n.trim()) document.title = n.trim()
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
